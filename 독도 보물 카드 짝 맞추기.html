<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독도 보물 카드 짝 맞추기 (실사)</title>
<style>
:root{--bg:#E6F4FC;--panel:#fff;--ink:#1F3347;--line:#B9DCF1;--p1:#E8590C;--p2:#1971C2;--acc:#F29B30;--onc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2233;--panel:#18344B;--ink:#E8F3FB;--line:#2C5675;--p1:#FF8A4C;--p2:#5AAEF5;--onc:#10202E}}
:root[data-theme="dark"]{--bg:#0F2233;--panel:#18344B;--ink:#E8F3FB;--line:#2C5675;--p1:#FF8A4C;--p2:#5AAEF5;--onc:#10202E}
*{box-sizing:border-box}html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:12px}
.wrap{margin:0 auto}
h1{margin:0 0 10px;text-align:center;font-size:clamp(1.3rem,4vw,2rem)}
.bar{display:grid;grid-template-columns:minmax(0,250px) auto minmax(0,250px);justify-content:center;gap:14px;align-items:stretch;margin-bottom:12px}
.pl{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:8px 12px 10px;text-align:center;transition:background .25s,opacity .25s,transform .25s}
.pl::before{content:"\00a0";display:block;font-size:.85rem;font-weight:900;line-height:1.3}
.pl.on{background:var(--c);border-color:var(--c);color:var(--onc);transform:scale(1.05);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 55%,transparent);animation:pop .5s}
.pl.on::before{content:"▶ 내 차례!"}
.pl.on input,.pl.on .w{color:var(--onc)}
.pl.on input{border-bottom-color:color-mix(in srgb,var(--onc) 60%,transparent)}
.go .pl:not(.on){opacity:.55}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.1)}100%{transform:scale(1.05)}}
#p0{--c:var(--p1)}#p1{--c:var(--p2)}
.pl input{width:100%;font:inherit;font-weight:700;font-size:1.1rem;color:var(--c);background:transparent;border:0;border-bottom:2px dashed var(--line);padding:2px 0;margin-bottom:6px;outline:none;text-align:center}
.pl input:focus{border-bottom-color:var(--c)}
.st{display:flex;gap:12px;align-items:baseline;justify-content:center;flex-wrap:wrap}
.w{font-size:1.9rem;font-weight:900;color:var(--c)}.w small{font-size:.9rem;font-weight:700;margin-left:2px}
.f{font-size:.95rem;opacity:.85}
.mid{display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:center}
button.b{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.b.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.b:active{transform:scale(.96)}
#msg{text-align:center;font-weight:900;font-size:clamp(1.1rem,3vw,1.5rem);margin:0 0 10px;min-height:2em}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;container-type:inline-size;width:min(100%,max(1100px,calc((100vh - 280px)*2.5)));margin:0 auto}
.c{aspect-ratio:1/1.05;perspective:800px;border:0;background:none;padding:0;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.i{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.c.f .i{transform:rotateY(180deg)}
.k,.t{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center}
.k{background:linear-gradient(145deg,#3AA0E0,#1F6FB5);color:#fff;font-weight:900;font-size:clamp(1rem,2.4cqw,3rem);border:3px solid #fff;box-shadow:0 2px 6px #0003}
.k{padding-bottom:26%}.k svg{position:absolute;left:6%;bottom:5%;width:88%;height:auto}
.t{transform:rotateY(180deg);background:#fff;border:3px solid #fff;box-shadow:0 2px 6px #0003}
.t img{width:100%;height:100%;object-fit:cover;object-position:center}.t img.pt{object-fit:contain}
.n{background:#FFF1BF;color:#3A2A00;flex-direction:column;text-align:center;font-weight:900;font-size:clamp(.78rem,1.75cqw,2.2rem);line-height:1.25;padding:4px;word-break:keep-all;overflow-wrap:anywhere}
.n span{font-size:.8em;font-weight:700}.n.l{font-size:clamp(.58rem,1.2cqw,1.6rem);overflow-wrap:normal}
.c.m .t{border-color:var(--oc);box-shadow:0 0 0 3px var(--oc)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:#1F3347;color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:5}
#toast.s{opacity:1;transform:translate(-50%,0)}
#ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.s{display:flex}
.md{background:var(--panel);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px #0006}
.md.tu{max-width:440px}.md h2{margin:0 0 8px;font-size:1.6rem}.md p{margin:0 0 16px;font-size:1.1rem}.md .r{display:flex;gap:10px;justify-content:center}
.tv{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;min-height:70px}.br{flex-basis:100%;height:0}
.mp{padding:6px 12px;border-radius:12px;border:3px solid var(--line);font-weight:900;color:var(--c);opacity:.7}.mp.on{background:var(--c);color:var(--onc);border-color:var(--c);opacity:1}
.mc{width:64px;height:66px;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 5px #0003;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;background:#FFF1BF;color:#3A2A00;text-align:center}.mc img{width:100%;height:100%;object-fit:contain;background:#fff}
.mc.ok{box-shadow:0 0 0 3px #2F9E44}.mc.bad{box-shadow:0 0 0 3px #E03131}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
@media(max-width:760px){.mid{flex-wrap:wrap}#p0{order:1}#p1{order:2}.mid{order:3}.n.l{font-size:2.5vw}.board{grid-template-columns:repeat(4,1fr);gap:6px}.bar{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;flex-direction:row}}
</style></head><body><div class="wrap">
<h1>독도 보물 카드 짝 맞추기</h1>
<div class="bar">
 <div class="pl" id="p0"><input id="n0" maxlength="10" aria-label="플레이어 1 이름"><div class="st"><span class="w"><b id="w0">0</b><small>승</small></span><span class="f">이번 판 짝 <b id="f0">0</b></span></div></div>

 <div class="pl" id="p1"><input id="n1" maxlength="10" aria-label="플레이어 2 이름"><div class="st"><span class="w"><b id="w1">0</b><small>승</small></span><span class="f">이번 판 짝 <b id="f1">0</b></span></div></div>
</div>

<div class="board" id="bd"></div></div>

function tut(i){
 const [t,p,v]=TU[i],m=$('#md');m.className='md tu';
 m.innerHTML='<h2>'+t+'</h2><div class="tv">'+v+'</div><p>'+p+'</p><div class="dots">'+TU.map((_,j)=>'<i'+(j===i?' class="on"':'')+'></i>').join('')+'</div><div class="r"></div>';
 const r=m.lastChild,add=(x,f,g)=>{const b=document.createElement('button');b.className='b'+(g?' g':'');b.textContent=x;b.onclick=f;r.append(b)};
 const done=()=>{$('#ov').classList.remove('s');m.className='md';if(!S.seen){S.seen=true;save()}};
 if(i>0)add('이전',()=>tut(i-1),1);
 if(i<TU.length-1){add('다음',()=>tut(i+1));add('건너뛰기',done,1)}else add('게임 시작!',done);
 $('#ov').classList.add('s')}
$('#help').onclick=()=>tut(0);
start();
if(!S.seen)tut(0);
</script></body></html>
